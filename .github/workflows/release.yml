name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Prepare release tag & metadata ──────────────────────────────────────────
  prep:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set_meta.outputs.release_tag }}
      release_name: ${{ steps.set_meta.outputs.release_name }}
      is_prerelease: ${{ steps.set_meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set_meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=DC Finance Client ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "release_tag=latest" >> $GITHUB_OUTPUT
            echo "release_name=DC Finance Client (Latest Build)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f latest
            git push -f origin latest || true
          fi

  # ── Portable self-contained bundles (one per platform, zero install) ───────
  portable:
    name: Portable (${{ matrix.platform }})
    needs: [prep]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            zip-suffix: macos
          - platform: ubuntu-latest
            zip-suffix: linux
          - platform: windows-latest
            zip-suffix: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --cache /tmp/npm-cache

      - name: Build portable bundle
        run: node scripts/package-portable.js

      - name: Zip portable bundle (macOS/Linux)
        if: matrix.platform != 'windows-latest'
        run: |
          cd portable-release
          zip -r ../DCFinanceClient-portable-${{ matrix.zip-suffix }}-${{ needs.prep.outputs.release_tag }}.zip .

      - name: Zip portable bundle (Windows)
        if: matrix.platform == 'windows-latest'
        run: Compress-Archive -Path portable-release\* -DestinationPath DCFinanceClient-portable-${{ matrix.zip-suffix }}-${{ needs.prep.outputs.release_tag }}.zip
        shell: pwsh

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.zip-suffix }}
          path: DCFinanceClient-portable-${{ matrix.zip-suffix }}-${{ needs.prep.outputs.release_tag }}.zip
          retention-days: 1

  # ── Tauri native desktop builds ────────────────────────────────────────────
  tauri:
    name: Tauri (${{ matrix.platform }})
    needs: [prep]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node dependencies
        run: npm install --cache /tmp/npm-cache

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prep.outputs.release_tag }}
          releaseName: ${{ needs.prep.outputs.release_name }}
          releaseBody: |
            ## ${{ needs.prep.outputs.release_name }}

            ### 🖥️ Native Desktop App (recommended)
            Full-featured desktop app with background autostart on system login.

            | Platform | File |
            |---|---|
            | Windows | `.msi` or `.exe` installer |
            | macOS | `.dmg` (Universal — Intel + Apple Silicon) |
            | Linux | `.AppImage` or `.deb` |

            ### 📦 Portable Bundle (no install needed)
            No Node.js, no Rust, no compilation — just unzip and launch.

            | Platform | File |
            |---|---|
            | macOS | `DCFinanceClient-portable-macos-${{ needs.prep.outputs.release_tag }}.zip` |
            | Linux | `DCFinanceClient-portable-linux-${{ needs.prep.outputs.release_tag }}.zip` |
            | Windows | `DCFinanceClient-portable-windows-${{ needs.prep.outputs.release_tag }}.zip` |

            **How to run portable**:
            - **macOS / Linux**: Unzip and run `./start.sh`
            - **Windows**: Unzip and double-click `start.bat`
          releaseDraft: false
          prerelease: ${{ needs.prep.outputs.is_prerelease == 'true' }}
          args: ${{ matrix.args }}

  # ── Attach portable bundles to the release ─────────────────────────────────
  attach-portables:
    name: Attach Portable Bundles
    needs: [prep, portable, tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Download all portable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.release_tag }}
          files: DCFinanceClient-portable-*-${{ needs.prep.outputs.release_tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
