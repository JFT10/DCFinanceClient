[package]
name = "dc-finance-client"
version = "0.1.0"
description = "DemocracyCraft Finance Client"
authors = ["JFT10"]
edition = "2021"

[lib]
name = "dc_finance_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
